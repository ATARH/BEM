**БИОЭНЕРГОМАССАЖЕР FOHOW 1.0**
**Часто задаваемые вопросы**

**1. Что такое биоэнергомассажер?**
Биоэнергомассажер - это высокотехнологичный прибор, разработанный на основе теории традиционной китайской медицины об энергетических каналах и внутренних органах. Данный прибор объединяет в себе передовые достижения в биоинформатике, энергетике, неврологии и других областях. Он оказывает комплексный физиотерапевтический эффект, подобный иглоукалыванию, массажу гуаша, туйна, прижиганию и вакуумной терапии. Благодаря специальному физиотерапевтическому воздействию на энергетические каналы и биологически активные точки, достигается быстрое очищение энергетических каналов. Это способствует улучшению циркуляции энергии Ци и крови, восстановлению баланса Инь-Ян внутренних органов и повышению уровня биологической энергии организма. Регулярное применение Биоэнергомассажера позволяет достичь общего профилактического и оздоровительного эффекта.

**2. Для чего необходимо продвигать данный продукт?**
Корпорация Fohow стремится к своей заветной мечте - распространить культуру поддержания здоровья Ян-Шэн во благо здоровья человечества, стать лидером мировой индустрии здоровья.
Наша компания унаследовала древнейший опыт традиционной китайской медицины. Мы рассматриваем нашу жизнь в трех направлениях философии Ян-Шэн: Ян-Шэн поведения, Ян-Шэн психологии и Ян-Шэн питания.
Путем осознанного контроля поведения, регуляции эмоций и рациона питания, мы придерживаемся здорового образа жизни, а биоэнергомассажер Fohow - это новая оздоровительная физиотерапевтическая методика Ян-Шэн.

**3. Цель продвижения Биоэнергомассажера Fohow?**
Потребности, продиктованные прогрессом:
1) Здоровье является главной потребностью современного общества.
2) Инновации в оздоровлении, распространение традиционной китайской медицины, продвижение немедикаментозных способов профилактики и лечения.
3) Перспективы развития персонального сервиса.
4) Востребованность профессионального сервиса.
5) Соответствие действующему законодательству.
Необходимость развития предприятия:
1) Усиливает конкурентное преимущество предприятия и продукции.
2) Оказывает быстрый ощутимый эффект, который заметен клиенту уже после первого применения, увеличивает эффективность взаимодействия с потенциальным клиентом.
3) Максимальная сосредоточенность, полная самоотдача - это основная стратегия развития компании.
4) Все большее количество партнеров присоединяются к нашей команде, расширяя сеть потребителей.
Потребность самого партнера и его клиентов:
1) Упрощает работу партнера: позволяет сократить дистанцию с потенциальным клиентом, создать с ним доверительные отношения, получить большее количество постоянных клиентов и привлечь их окружение благодаря использованию маркетинга «впечатлений», «эмоций», «обучения» и «сервиса».
2) Клиент обретает уверенность и спокойствие, ощущая заботу о его здоровье.

**4. Является ли биоэнергомассажер сертифицированным физиотерапевтическим прибором, разрешенным к продаже?**
Биоэнергомассажер - это один из лучших продуктов корпорации Fohow. При разработке и освоении продукции наша компания всегда придерживается основных принципов: легальность, безопасность и эффективность; натуральные ингредиенты и защита окружающей среды; соответствие научным принципам культуры поддержания здоровья ТКМ.
Вся продукция должна соответствовать юридическим и нормативным актам, а также иметь все необходимые разрешения, и только после этого она допускается к выпуску на рынок. Биоэнергомассажер Fohow получил сертификат соответствия и лицензию на продажу, он абсолютно легален.

**5. Безопасен ли биоэнергомассажер? Вызывает ли он побочные эффекты?**
Биоэнергомассажер является совершенно безопасным прибором, что подтверждает сертификат соответствия качества. Выходное напряжение прибора составляет 8 вольт, что совпадает с биотоками клеток организма.
Прибор безопасен для клиента и специалиста, который с ним работает. Он преобразует электрические импульсы в биотоки, которые совпадают с электрическим зарядом клеток человека. Биоэнергомассажер восстанавливает энергию клеток, освобождает энергетические каналы.

**6. Насколько эффективен Биоэнергомассажер Fohow?**
Данный прибор оказывает незамедлительный эффект, что подтверждается большим количеством личных примеров его использования. Если вы еще не успели ощутить действие биоэнергомассажера, мы предлагаем вам непременно попробовать процедуру биоэнергомассажа.

**7. Каков принцип действия биоэнергомассажера?**
Прибор состоит из основного блока и специальных перчаток. С помощью специального физиотерапевтического воздействия на энергетические каналы и биологически активные точки происходит мгновенное их очищение и восполнение находящейся в них изначальной энергии Ци. Беспрепятственная циркуляция Ци улучшает кровообращение и повышает уровень биоэнергии организма, за счет чего восстанавливается баланс энергий Инь-Ян и достигается общий профилактический оздоровительный эффект.

**8. В каких целях использовать прибор?**
Бессонница, неврозы, желудочно-кишечные расстройства, отсутствие аппетита, запоры, геморрой, кожный зуд, ревматические заболевания, артрит, шейный спондилез, боль в пояснице и ногах, травмы, повреждение мягких тканей, повреждение костей, головокружение, звон в ушах, гипертрофия простаты, анемия, гипертония, гипергликемия, диабет, осложнение после сотрясения мозга, ишемические заболевания, климактерический синдром, переутомление.

**9. Как объяснить столь широкий спектр применения прибора?**
Согласно фундаментальной теории ТКМ об энергетических каналах: где нет застоев, там нет боли - где есть застои, там появляется боль. Застои - препятствия в циркуляции Ци, они являются причиной возникновения огромного количества заболеваний.
Энергетические каналы - это линии жизни человека, которые соединяются с внутренними органами и всеми частями тела. В ТКМ проблемы с меридианами рассматривают как причину возникновения заболеваний. Соответственно, ключом к оздоровлению и поддержанию здоровья является освобождение энергетических каналов. ("Нэйцзин". Трактат Желтого императора о внутреннем, первое классическое медицинское произведение в Китае).

**10. Кому рекомендуется биоэнергомассаж?**
Людям, страдающим от бессонницы, с дисфункцией желудочно-кишечного тракта, ревматическими заболеваниями, гипертонией, гиперлипиемией, сахарным диабетом, ишемическими заболеваниями, переутомлением, распространенными возрастными заболеваниями.
В первую очередь рекомендуется применение прибора людям пожилого возраста и молодым людям, подвергающимся сильным нагрузкам.

**11. Есть ли противопоказания и меры предосторожности в применении биоэнергомассажера?**
Существует ряд противопоказаний, при которых не рекомендуется применение биоэнергомассажера.
1. Если клиент скептически относится к процедуре и не испытывает желание взаимодействовать со специалистом, выполняющим массаж.
2. Опухоли, гематоноз, инфекционные заболевания, психические расстройства, тяжелые заболевания сердца, патологии головного мозга и легких.
3. Переломы костей, кровотечения и склонность к кровотечениям, разрывы мышц, сухожилий и связок, гнойный артрит, повреждения кожных покровов, язвы, фурункулы и нарывы.
4. Пороки развития позвоночника, костный стеноз позвоночного канала, стеноз межпозвоночного отверстия.
5. Беременность, период менструации, послеродовые кровотечения.
6. Старческая немощь, переутомление, чрезмерный голод; не рекомендуется использовать биоэнергомассажер ранее, чем через полчаса после приема пищи, при алкогольном опьянении.
7. Высокое кровяное давление (верхнее 160 mmhg, нижнее 120 mmhg), операции на сердце, наличие кардиостимулятора и других имплантов.
8. Дети до 8 лет.
9. Не рекомендуется применять прибор в грозовую погоду.

**12. Почему нельзя использовать биоэнергомассажер при наличии некоторых заболеваний?**
Биоэнергомассажер первоначально предназначен для профилактики и поддержания здоровья, а не для лечения заболеваний. Существует ряд заболеваний, при которых его нельзя использовать, перед применением обязательно ознакомьтесь с противопоказаниями.

**13. Можно ли во время процедуры держать при себе мобильный телефон и металлические украшения?**
Нет, это может влиять на работу прибора; во время процедуры рекомендуется снять с себя все металлические украшения и не держать в непосредственной близости средства связи.

**14. Не вреден ли биоэнергомассажер для специалиста, выполняющего массаж?**
Использование биоэнергомассажера безопасно как для клиента, так и для специалиста, более того, способствует восстановлению баланса энергий Инь-Ян.

**15. Каким эффектом обладает биоэнергомассажер?**
Основное действие Биоэнергомассажера Fohow:
1. Выведение токсинов, очистка крови.
2. Улучшение кровообращения.
3. Улучшение обмена веществ.
4. Повышение клеточной активности, укрепление иммунитета, самовосстановление организма.
5. Снятие отеков, обезболивание, укрепление костей и мышц.
6. Регуляция вегетативной нервной системы, улучшение качества сна.
7. Регуляция эндокринной системы, косметический эффект, снижение веса.
8. Освобождение энергетических каналов, устранение застоев крови.

**16. Как долго нужно проходить процедуры, чтобы достичь улучшения?**
Биоэнергомассажер предназначен для профилактики и поддержания здоровья. В процессе его применения происходит очищение организма от токсинов, улучшается кровообращение и обмен веществ, освобождаются энергетические каналы, происходит регуляция энергий Инь-Ян внутренних органов, активизируются клетки, укрепляется иммунитет. Таким образом улучшается способность организма к самовосстановлению. В результате, человек может выйти из предболезненного состояния и достичь эффекта самовосстановления.
Основываясь на принципах регуляции ТКМ, короткий курс составляет 7 дней, полноценный курс длится 30 дней. После прохождения полного курса можно почувствовать значительные изменения. Безусловно, продолжительность курса определяют, основываясь на состоянии здоровья конкретного человека. Регулярное использование прибора позволит поддерживать здоровье в хорошем состоянии, сохранять красоту и молодость.

**17. Каким образом биоэнергомассажер освобождает энергетические каналы? Каков принцип его работы?**
Биоэнергомассажер - это высокотехнологичный прибор, состоящий из основного блока и пары специальных перчаток. Благодаря физиотерапевтическому воздействию на энергетические каналы и биологически активные точки он мгновенно устраняет застои и блоки.
С помощью специального физиотерапевтического воздействия на энергетические каналы и биологически активные точки происходит мгновенное их освобождение и восполнение находящейся в них изначальной энергии Ци. С точки зрения традиционной китайской медицины, энергия Ци приводит в движение кровь. Если энергия Ци и кровь циркулируют беспрепятственно, то в организме появляется достаточное количество энергии и достигается необходимый баланс Инь-Ян внутренних органов.

**18. Достаточно ли проста техника использования прибора? Легко ли ей овладеть? Где и как это сделать?**
Биоэнергомассажер разрабатывался как домашний прибор для поддержания здоровья всей семьи, поэтому он очень прост в использовании. Обучиться технике его применения очень просто, для этого достаточно двух часов эксплуатации, а для освоения техник его применения в домашних условиях достаточно пройти трехдневное обучение. В нашей компании есть специалисты, которые обучат вас этому. Если вы приобрели прибор, вы можете принять участие в бесплатном обучении от Международного бизнес-колледжа и Исследовательского института Всемирной ассоциации иглоукалывания и моксатерапии и получить сертификат о прохождении обучения работе на приборе. Если вы желаете овладеть более продвинутыми техниками работы с прибором, вы можете принять участие в специальных семинарах компании по подготовке специалистов среднего и высокого уровня.

**19. Почему мы называем биоэнергомассаж естественной и безопасной техникой восстановления?**
Биоэнергомассаж является нетравматической техникой, которая не причиняет вреда человеку и не вызывает побочных эффектов. Более того, сама процедура не вызывает дискомфорта и достаточно приятна. Таким образом, совершенно незаметно происходит профилактика гипертонии, гиперлипиемии, гипергликемии, обезболивание, регуляция эндокринной системы, улучшение качества сна, коррекция позвоночника, улучшение половой функции, замедление процессов старения, достигается косметический эффект.

**20. Можно ли обучиться использованию данного прибора, не имея специального медицинского образования?**
Да, конечно. Базовым навыкам использования прибора можно обучиться в течении двух часов. Для того, чтобы использовать прибор дома в целях профилактики, достаточно пройти трехдневное обучение.

**21. Что входит в стоимость биоэнергомассажера?**

**24. Создает ли биоэнергомассажер вредное электромагнитное излучение?**

**25. Бывают ли реакции обострения на применение биоэнергомассажера?**
В процессе применения биоэнергомассажера у людей разных возрастных категорий, с разных состоянием здоровья, могут проявляться разные реакции. Практически здоровый человек во время применения не будет испытывать никакого дискомфорта, у людей же в предболезненном или болезненном состоянии могут появиться реакции обострения. Чем слабее организм, тем сильнее может быть «отдача» реакции.

**26. Почему в процессе применения прибора могут появиться реакции обострения?**
Данный прибор регулирует организм по принципу «изнутри наружу». Не стоит пугаться, если после применения биоэнергомассажера появились реакции обострения - это говорит лишь о том, что в организме начались активные процессы улучшения. Обычно реакции обострения появляются через 2-3 сеанса использования, иногда позже. Несмотря на то, что данные реакции доставляют дискомфорт, они являются первым шагом к оздоровлению. Не бойтесь использовать биоэнергомассажер, обычно через 3-15 дней (иногда позже) эти реакции постепенно уменьшаются и проходят. После того, как они постепенно исчезнут, улучшится общее состояние организма.

**27. Что такое реакция обострения?**
Реакция обострения (согласно ТКМ улучшению состояния организма может предшествовать стрессовая реакция) - это освобождение меридианов, восполнение Ци, быстрое выведение токсинов, которые достигаются благодаря физиотерапевтическому воздействию биоэнергомассажера. Ци приводит в движение кровь.
Когда Ци и кровь беспрепятственно циркулируют в организме, достигается быстрое выведение токсинов, улучшение усвояемости питательных веществ, укрепление иммунной системы и способности организма к самовосстановлению. В период использования прибора может появиться ощущение прилива сил и энергии; при активной детоксикации могут участиться позывы в туалет; в процессе освобождения меридианов может появиться ощущение ломоты и ноющей боли; в процессе самовосстановления организма могут возникнуть усталость и сонливость.

**28. Каковы наиболее распространенные реакции обострения?**
Реакции обострения напрямую связаны с общим состоянием организма: возрастом, состоянием здоровья и другими факторами. В зависимости от этого могут проявляться разные реакции:
1. Сильное утомление, сонливость, метеоризм - разжижение крови, выведение излишних жиров, холестерина, химических веществ, остатков лекарственных препаратов.
2. Ощущения жара в теле, повышенная температура - в организме происходит активная регуляция иммунной системы.
3. Запор - регуляция функции толстого кишечника.
4. Диарея - регуляция функции тонкого кишечника или выведение накопленных токсинов.
5. Острая диарея - выведение скопившейся воды из кишечника.
6. Бессонница или ухудшение качества сна, отсутствие ощущений сонливости и усталости - снятие нервного напряжения.
7. Язвы по всему телу, нарывы, покраснения, сыпь, зуд - организм выводит токсины крови.
8. Сухость во рту и горле, трещины на губах, синдром «жара печени» (ТКМ) - большое количество токсинов в печени, проявление резкого увеличения нагрузки на печень.
9. Регулярное появление язв во рту и боли в горле вследствие длительного применения фармакологических препаратов - выведение химических веществ лекарственных препаратов, накопившихся в печени и крови.
10. Слезы - реакция выведения токсинов и восстановления печени.
11. Головокружение, головные боли - растворение избыточных жиров или холестерина в кровеносных сосудах головного мозга, реакция на нестабильное кровяное давление.
12. Гипертонус - активизация иммунных клеток.
13. Сонливость - расстройство физиологических функций или болезненное состояние. Организм находится в процессе выведения токсинов, на что затрачивает большое количество Ци и крови, которые производятся во время сна.
14. Дерматомикоз ног, белок в моче - выведение патогенного фактора холода* из желудка.
15. Вздутие живота, кровь в стуле, запор, дегтеобразный стул - выведение токсинов из толстого кишечника, реакция восстановления.
16. Головокружение, отечность в области ушей - выведение токсинов тонкого кишечника, реакция восстановления сердца.
17. Повышение кровяного давления - восстановление стенок сосудов, реакция на растворение бляшек.
18. Чувство голода - регуляция процессов питания организма.
19. Неприятный запах ног, неприятный запах изо рта - увеличение количества бактерий во время активной детоксикации организма.
20. Выпадение волос - стимуляция обновления волосяных фолликулов, замена старых, поврежденных волосяных фолликулов новыми.
21. Сыпь - выведение патогенного фактора сырости*, выведение водорастворимых токсинов.

* - Согласно ТКМ на состояние организма могут влиять факторы внешней среды: ветер, жар, зной, сырость, сухость и холод. Когда жизненная энергия организма (защитная Ци) ослаблена, эти факторы могут нести патогенный характер, проникая в организм и вызывая патологии.

**29. Что делать в случае возникновения реакций обострения?**
1. Если вы здоровы, во время процедуры вы не испытываете дискомфорта и организм не отзывается неприятными реакциями, смело используйте прибор. Незначительные симптомы обострения уйдут через несколько сеансов.
2. Если симптомы обострения сравнительно тяжелые, необходимо значительно сократить время процедуры, после исчезновения симптомов обострения постепенно увеличивайте время сеанса до нормы. Если реакции обострения протекают очень тяжело (особенно у пожилых людей), рекомендуется выдержать перерыв 1-2 дня.
3. Если реакции обострения не проходят на протяжении длительного периода времени, рекомендуется пройти плановый осмотр у специалиста с целью исключить возможность различных скрытых бессимптомных заболеваний в организме.

**30. По истечении какого времени после использования биоэнергомассажера могут проявиться реакции обострения?**
Реакции обострения проявляются индивидуально. Как уже говорилось, это обусловлено состоянием организма, возрастом и другими факторами; время проявления реакции тоже индивидуально.
1. У практически здоровых людей реакции обострения очень легкие, проходят во время сна или вовсе неощутимы.
2. У некоторых людей реакции обострения проявляются сразу во время применения прибора.
3. У небольшого количества людей реакции проявляются через 2-3 дня, бывает и так, что реакции появляются спустя 10 дней. Обычно реакции обострения проходят через 1-2 дня после возникновения, в некоторых случаях необходимо 7-10 дней.
4. У людей в пожилом возрасте или с ослабленным здоровьем реакции обострения протекают дольше, они более резкие и могут повторяться.

**31. Могут ли реакции обострения появляться постоянно?**
Реакции могут быть продолжительными или не очень, могут проявляться очень резко, или в легкой степени. Некоторым достаточно двух дней, чтобы организм перестроился и реакции обострения исчезли, но бывают случаи, когда реакции протекают длительное время и возникают повторно.

**32. Для чего рекомендуется обильный прием воды в период применения биоэнергомассажера?**
Из-за того, что в период применения биоэнергомассажера ускоряется обмен веществ, клетки расходуют большее количество воды, поэтому для улучшения выведения токсинов рекомендуется обильное питье, а именно 2,5-3 л воды в день (лучше всего пить биоактивную воду).

**33. Каково оптимальное время сеанса биоэнергомассажа?**
Обычно биоэнергомассажер применяют 1-2 раза в день, при этом рекомендуемая продолжительность процедуры - 30-60 минут. Начинать использовать прибор следует с коротких временных интервалов и постепенно увеличивать продолжительность процедур, учитывая возраст и состояние организма. Чем старше человек и слабее состояние организма, тем короче должна быть продолжительность процедуры.

**34. В какой период дня и при каких условиях лучше всего использовать биоэнергомассажер?**
Лучшее время для регуляции организма утром с 8 до 12 часов и во второй половине дня с 14 до 21 вечера. Не рекомендуется применять прибор в более поздние часы. Рекомендуемые температурные условия для сеансов биоэнергомассажа от 0 до 40С, при влажности воздуха не более 80%.

**35. Можно ли использовать биоэнергомассажер на протяжении длительного периода времени?**
Рекомендуется использовать биоэнергомассажер на протяжении 7 дней, затем сделать перерыв на 1 день, а затем снова использовать, уже на протяжении 15 дней. Снова выдержать паузу 3-5 дней. Таким образом, постепенно вы дойдете до полноценного 30-дневного регуляционного курса массажа.

**36. Что делать, если в процессе процедуры появилось головокружение и учащенное сердцебиение?**
Как правило, данные реакции проявляются у людей, страдающих повышенным кровяным давлением и заболеваниями сердца. Рекомендуется немедленно прекратить использование прибора, больше отдыхать, поддерживать тело в тепле, пить теплую воду с имбирем и медом.

**37. Во время физиотерапевтических процедур возникают ощущения зуда, ломоты, онемения, легкой колющей боли. Это нормально?**
Это нормальная реакция на освобождение меридианов, нет причин для беспокойства, продолжайте использование прибора.

**38. Как осуществлять уход за прибором?**
1. После использования не забывайте отключать прибор от сети, он не должен оставаться подключенным к электричеству длительное время.
2. Собирайте провода и комплектующие, вытирайте насухо внешнюю панель прибора, поддерживайте его в чистоте и сухости.
3. Избегайте механических повреждений.
4. Не допускайте попадания на прибор прямых солнечных лучей.
5. Не допускайте контакта с водой, чтобы избежать коррозии.
6. Не разбирайте прибор самостоятельно.

**39. Как долго можно использовать прибор в течение каждого дня?**
Возможно длительное использование прибора. Не забывайте отключать прибор от сети в перерывах между процедурами, чтобы он прослужил вам максимально долго.

**40. Какие меры предпринять в случае неисправности прибора?**
Необходимо связаться с сотрудником службы поддержки, не пытайтесь разбирать прибор, чтобы устранить поломку самостоятельно.

**41. Что входит в послепродажный сервис биоэнергомассажера?**
Установленный гарантийный срок составляет один год с момента приобретения, ремонт или замена прибора осуществляется в случае заводской неисправности. В течение первых трех лет возможен ремонт или замена прибора за дополнительную плату. Гарантийные обязательства не распространяются на случаи поломки прибора по вине пользователя или самостоятельного ремонта (вскрытия) прибора.

**42. Какой эффект можно получить благодаря использованию биоэнергомассажера и воздействия на тело при помощи различных методик работы рук?**
1. Расчесывание: очищение энергетических каналов, устранение застоев в меридианах, активизация кровообращения.
2. «Толкающая ладонь»: регуляция Ци и крови, очищение меридианов.
3. Вибрирование: устранение спаек и расслабление мышц; эффективен при образовании камней, болях в пояснице, бедрах, плечевом суставе.
4. Растирание: расслабление мышц, локальное улучшение проходимости ЦиСюэ (Ци и крови).
5. Покалывание: обезболивающий эффект.
6. Массирующие движения ладонями: эффект при несварении и вздутии живота, застое Ци и крови, суставных болях и мышечных спазмах, устранение застоев и отечности.
7. Надавливание: регуляция баланса Инь-Ян, устранение спазмов, рассеивание «ветра и холода».
8. Парное покалывание: очищение и активизация меридианов, устранение патогенных факторов. Отличный эффект при суставных болях (запястный, локтевой, коленный сустав).
9. Пощипывание: очищение меридианов, внутренняя и наружная регуляция, расслабление мышц, снятие спазмов.
10. Скручивание: активизация меридианов, смазывание суставов, устранение жара, болезненных ощущений, опухания суставов пальцев рук и ног, устранение дискомфорта при сгибании и разгибании суставов.
11. Расправление сухожилий: расслабление мышц, устранение застоев, повышение мышечного тонуса и эластичности мышц, часто используется для воздействия на область верхних и нижних конечностей, спины и живота, большой грудной и шейной мышцы.
12. Раздельная проработка пяти меридианов: гармонизация Ци и крови, устранение застоев, повышение жизненного тонуса. Эффективно при головокружениях и головных болях, нарушении зрения и шуме в ушах.
13. Проработка четырех конечностей по ходу меридианов: гармонизация Ци и крови, активизация меридианов, улучшение периферического кровообращения.
14. Регуляция интенсивности воздействия: согревание и улучшение проходимости меридианов, улучшение микроциркуляции. Обычно используется при близорукости, старческой дальнозоркости, рините, фарингите, звоне в ушах, головных болях. Косметический эффект, регуляция состояния суставов и кровообращения в области верхних и нижних конечностей.
15. Восстановление и очистка: легкое воздействие, малая интенсивность, короткое время, по часовой стрелке - очищение; и наоборот: активное воздействие, высокая интенсивность, длительное время, против часовой стрелки - восстановление. В процессе процедуры возможен баланс восстановления и очистки.

**43. Какие основные правила работы с биоэнергомассажером Fohow необходимо знать новичку?**
Длительность: правильное соотношение движений и прикладываемых усилий;
Сила: поддержание силы нажима и интенсивности;
Равномерность: баланс амплитуды и скорости движений;
Мягкость: гибкие и свободные движения во время процедуры;
Степень проникновения: воздействие должно оказываться не только на поверхность кожи, но и на сухожилия, мышцы, кости и внутренние органы (умеренно, но ощутимо).

**44. Назовите последовательные шаги при воздействии на область спины с помощью Биоэнергомассажера Fohow?**
Шаг первый: нанесение массажного геля
Распределите гель равномерно по всей поверхности спины, включая подмышки. Спина при этом должна быть расслаблена.

Шаг второй: проработка заnedereфицированного меридиана Ду-май
Движение начинается от точки Да-Чжуй и заканчивается в точке Хуань-Тяо.
Постепенно начинаем выполнять ладонями продавливающие движения по направлению к точке Хуань-тяо, останавливаемся у точки Хуань-Тяо на раз для женщин. Интенсивность устанавливаем в диапазоне 14-18 единиц (может регулироваться в зависимости от индивидуальных особенностей пациента).

Шаг третий: проработка меридиана мочевого пузыря
Движение начинается с двух сторон от точки Да-чжуй и заканчивается в точке Ба-ляо. Два больших пальца прилегают к точке Цзя-цзи, пять пальцев двигаются вниз через область сердца, затем ладонь свободно поднимается и снова постепенно опускается в область точки Ба-ляо и задерживается на 5-10 секунд, повторяем это массажное движение 9 раз для мужчин и 8 раз для женщин. Интенсивность устанавливаем в диапазоне 12-16 единиц (может регулироваться в зависимости от индивидуальных особенностей пациента).

Шаг четвертый: проработка комплементарен Ду-май
Сначала прорабатывается левая, затем правая сторона. Одна рука помещается на точке Чан-Цян, другая, - начиная от точки Да-чжуй, собирающим движением через надпостную мышцу двигается к подмышке и останавливается в области точки Ци-чжоу на 5-10 сек., затем продолжает движение вниз по комплементарным По-май. При этой не должно быть зазора между ладонью и поверхностью кожи. Движение заканчивается в области описывающего меридиана Дай-Май. Опосредующий меридиан Дай-Май прорабатывается там на 5-10 сек. Данный цикл повторяется 3 раза, затем следует проработка другой стороны. Интенсивность устанавливается в диапазоне 12-16 единиц (может регулироваться в зависимости от индивидуальных особенностей пациента).

Шаг пятый: фиксированное воздействие на точку
Одна рука помещается на точке Чан-Цян, другая на точке Да-чжуй, при этом необходимо постепенно увеличивать интенсивность (по мере адаптации пациента), при достижении предела необходимо выдержать интервал в 1 минуту, и после этого резко снизить интенсивность до начального уровня.

Шаг шестой: фиксированное воздействие на опоясывающий меридиан Дай-Май
Обе руки располагаются в области точки Мин-мэнь и плотно прижимаются к опоясывающему меридиану Дай-Май, интенсивность постепенно увеличивается до появления болевых ощущений в области поясницы, после этого выдерживается интервал в 1 минуту. Данный цикл повторяется 2 раза.

Шаг седьмой: фиксированное воздействие на точку Чэн-фу
Обе руки плотно прилегают к точке Чэн-фу, интенсивность увеличивается постепенно, до предела чувствительности пациента, затем выдерживается интервал в 1-2 мин.

Шаг восьмой: выведение из точек патогенного фактора «ветра»
Начиная с точки Цзянь-цзин, десятью пальцами пройти по точкам Ци-чжоу, Бин-бао, Чу-чи, Шоу-сань-ли, Нэй-гуань, Шэнь-мэнь, Тай-юань, Хэ-гу, Хоу-си, этот процесс занимает 5-10 минут. Контроль интенсивности: начиная с точки Чу-чи можно увеличивать интенсивность, при этом снижая силу нажима пальцами.

Шаг девятый: нанесение энергетического бальзама
Основные требования: энергетический бальзам необходимо нанести на всю поверхность спины, особенно на точки Да-чжуй, Ба-ляо, А-ши-сюэ, затем обернуть кожу пищевой пленкой на 30 минут.

Указания после выполнения процедуры: следите за тем, чтобы пациент не переохлаждался, обеспечьте его необходимой вспомогательной продукцией, расскажите пациенту о возможных реакциях, которые могут предшествовать улучшению и объясните, что данные реакции являются нормальными и их не стоит бояться.
1. Предупредите пациента, чтобы он не переохлаждался и в ближайшие 2 часа после процедуры не принимал душ.
2. Предупредите пациента, чтобы в ближайшие 2 часа после процедуры он не пил крепкий чай. Порекомендуйте ему теплую воду или подслащенный имбирный отвар.
3. В зависимости от состояния организма пациента, подберите соответствующую оздоровительную продукцию.
4. Предупредите о возможных реакциях и методах их устранения.

**45. На что нужно обращать внимание, воздействуя на организм с помощью прибора?**

**75. Могут ли после процедуры появиться отеки?**
У людей со сниженной функцией почек после процедуры может появиться кратковременная отечность, это является нормальной реакцией.

**76. Почему биоэнергомассажером не могут пользоваться люди с тяжелой формой гипертонии?**
Людям с верхним давлением более 160 и нижним более 120 не рекомендуется использовать биоэнергомассажер. Процедура должна проводиться только под контролем высококлассного специалиста.

**77. После процедуры появился кожный зуд и высыпания на коже. В чем причина?**
Это является реакцией организма на выведение токсинов. При сниженной функции печени, большом количестве токсинов в печени, кожных заболеваниях, длительном приеме гормональных препаратов, использовании косметики с содержанием тяжелых металлов, длительном применении химических препаратов и лекарственных средств, в организме скапливается большое количество токсинов. Их выведение может сопровождаться кожным зудом и сыпью. Рекомендуется пить больше воды, выдерживать режим сна, есть больше свежих овощей и фруктов. При этом можно продолжать процедуры, однако необходимо снизить интенсивность и сократить время процедуры.

**78. После процедуры появилось чувство сдавленности в груди и нарушенное сердцебиение. В чем причина?**
Данная реакция встречается у людей с ослабленной функцией сердца. Рекомендуется прервать процедуры на несколько дней. Людям с серьезными пороками сердца и легких не рекомендуется использовать биоэнергомассажер.

**79. После процедуры произошли изменения цвета, запаха и количества мочи. В чем причина?**
Данные изменения указывают на сниженные функции почек, заболевания предстательной железы или мочеполовой системы. Рекомендуется пить больше воды, можно продолжить процедуры, однако необходимо снизить их продолжительность и интенсивность, и если симптомы усугубляются, необходимо пройти обследование у соответствующего специалиста.

**80. После процедуры появляется сильная усталость, сонливость, сухость во рту. В чем причина?**

**82. После процедуры появился кожный зуд, сухость во рту, язвы в ротовой полости. С чем это связано?**
Причиной подобной реакции могут быть раздражения печени и желудка. Данная причина не является основанием для беспокойства, рекомендуется пить больше воды, процедуры можно продолжать.

**83. После процедуры появилось головокружение и рябь в глазах. С чем это связано?**
Данная реакция проявляется у людей с пониженным давлением и низким уровнем сахара в крови. Рекомендуется пить имбирный отвар с бурым сахаром или медовую воду, выдерживать режим отдыха.

**84. Почему нельзя пользоваться биоэнергомассажером во время менструации?**
Биоэнергомассажер улучшает кровообращение, устраняет застой крови, поэтому его использование в период менструации может спровоцировать увеличение количества выделений во время месячных.

Во избежание критических ситуаций у пациентов, страдающих тяжелыми патологиями сердца и легких, процедура должна производиться только под наблюдением опытного врача.

Использование прибора при простуде не подходит для восстановления организма, так как может спровоцировать повышение температуры.

Капилляры в области поясницы находятся ближе к поверхности кожи, поэтому во время их проработки возникает ощущение покалывания. Это считается нормальной реакцией, при которой можно продолжать использование прибора.

**111. Что такое кордицепс?**
Кордицепс - это уникальное лекарственное средство китайской медицины, способное регулировать и энергию Инь и энергию Ян. «Кордицепс» в переводе с китайского означает «зимой - червь, летом - растение». Этот вид спортивных грибов, паразитирующий на гусеницах определенного вида бабочек Hepialide (бабочка «летучая мышь»), является ценным традиционным китайским растительным лекарством и укрепляющим средством, «царем растений» в древнем трактате о растениях. Древние исследователи лекарственной ценности кордицепса берут начало в «Новой компиляции фармакопеи». Он имеет сладковатый вкус, теплый по природе (свойство лекарства), улучшает работу почек и легких, улучшает гемостаз, выводит мокроту. Пополняет Ци, согревает Ян, восполняет Инь и кровь, питает печень и почки, укрепляет селезенку и желудок, укрепляет кости и мышцы.
Современные медицинские исследования показывают, что кордицепс содержит протеины, жиры, сырую клетчатку, углеводы, политамины, кордицепин, кордицепую кислоту, полисахариды кордицепса, мультивитаминосы, а также железо, фосфор, кальций, цинк, марганец, селен и другие необходимые организму питательные вещества. Его можно использовать для лечения хронического нефрита, хронической почечной недостаточности, хронического бронхита, хронического гепатита, коронарной болезни сердца, аритмии, новообразований, гиперлипидемии, полового бессилия и других заболеваний.

**113. Что такое Линчжи?**
С незапамятных времен Линчжи считается символом счастья и богатства, красоты и долголетия, также его называли «божественным растением», «чудесным грибом». С древних времен в Китае он считается лекарственным растением, которое обладает питающим и тонизирующим эффектом, повышает сопротивляемость организма. В фольклоре линчжи способен возвращать к жизни и дарить бессмертие.
В «Травнике Шэньнуна» упоминается, что линчжи «восполняет жизненные силы, не отравляет организм, улучшает самочувствие, при применении не вредит организму, улучшает самочувствие, восполняет Ци, омолаживает и продлевает жизнь».
Исследования лекарственной ценности линчжи в древности: линчжи обладает сладко-горьким вкусом, нейтральным характером, недовитый, воздействует на энергетические каналы сердца, легких, печени, почек. Излечивает общее истощение, кашель, одышку, бессонницу, укрепляет Ци и кровь, улучшает процесс дыхания, полезен для суставов, улучшает умственную деятельность, укрепляет мускулатуру, улучшает цвет лица, повышает умственные способности, отличается целым рядом полезных свойств, продлевает жизнь. Улучшает самочувствие, омолаживает организм и дарит долголетие.
Современные медицинские исследования показывают, что активные лекарственные компоненты линчжи можно разделить на 10 основных групп, в их числе полисахариды Ганодермы, полипептиды линчжи, тритерпены, 16 видов аминокислот (среди них 7 видов жизненно необходимых организму), белки, стерины, маннитол, кумарин, алкалоиды, органические кислоты, (преимущественно фумаровая кислота), также такие элементы как Ge, P, Fe, Ca, Mn, Zn и др. Линчжи оказывает двунаправленное регулирующее действие при лечении заболеваний печени, регулирует работу сосудов сердца и головного мозга, пищеварительную, нервную деятельность, внутреннюю секрецию, дыхание, двигательную и многие другие системы. Линчжи обладает ярко выраженным лечебно-профилактическим эффектом при новообразованиях, патологических изменениях печени, бессоннице и преждевременных процессов старения.

10. Головной отдел: повышение энергии Ян, заряд бодрости и энергии, снятие стресса и усталости, улучшение кровообращения, улучшение когнитивных функций мозга, достижение баланса секреции гормонов гипофиза, замедление процессов старения, устранение симптомов шума в ушах и мерцания в глазах, стимуляция и питание волосяной части головы.

**130. Каковы 3 главных принципа действия ультразвуковой насадки?**
1. Воспроизводимая ультразвуковая волна создает микромассажные вибрации, воздействующие на клетку, что позволяет повысить клеточную активность, увеличить клеточную проницаемость, восстановить нормальный клеточный метаболизм.
2. Мягкое глубокое тепловое воздействие обеспечивает беспрепятственную циркуляцию жидкостей в кровеносных и лимфатических системах, позволяет восстановить тонус и упругость дермы.
3. Частотный резонанс от воздействия ультразвуковой насадки приводит к образованию пузырьков в жидких средах организма. Это вызывает микроколебания, повышающие проницаемость клеточных мембран, что стимулирует выведение продуктов обмена веществ через поры.

**131. Каковы основные функции ультразвуковой насадки?**
1. Частота волны ультразвуковой насадки Fohow достигает 1 мГц и эквивалентна 1 млн массажных вибраций в секунду. Воспроизводимые волны стимулируют жизнедеятельность клеток, способствуют размягчению затвердевших соединительных тканей и расщеплению подкожных жиров. Быстрое повышение температуры в глубоких слоях кожи при помощи ультразвука приводит к улучшению кровообращения и нормализации обмена веществ (выведение токсинов и шлаков) и повышению клеточной активности.
2. Высокая проницаемость ультразвуковой волны оказывает глубокое воздействие на жировую ткань, способствуя коррекции фигуры, избавлению от лишнего веса и улучшая состояние кожи.
3. Энергия ультразвуковой волны оказывает эффект микромассажа кожи лица. Благодаря такому воздействию происходит локальное улучшение циркуляции крови и лимфы, повышается клеточная проницаемость, повышается метаболизм и регенерация соединительной ткани, происходит стимуляция нервных окончаний, что благоприятно сказывается на состоянии кожи, делая ее здоровой, упругой и гладкой.
4. Ультразвуковая насадка обладает смарт-функцией импорта питательных компонентов и экспорта продуктов обмена веществ, что позволяет очистить поры и вывести токсины, осуществляет подкожную доставку питательных веществ, подтягивает кожу, убирает морщины, осветляет пигментные пятна, способствует получению лица и тела.
5. За счет повышения клеточной активности и увеличения уровня коллагена кожа становится мягкой и гладкой.
6. Противовоспалительный эффект и устранение угревой сыпи, сужение пор, восстановление баланса секреции сальных желез, уменьшение жирного блеска кожи и акне.

**132. На что необходимо обратить внимание при использовании ультразвуковой насадки?**
1. Перед использованием насадки предварительно очистите зону воздействия. Чтобы обеспечить максимальную проницаемость звуковой волны, очистите рабочую поверхность насадки.
2. В качестве жидкой проводящей среды для ультразвуковой насадки необходимо использовать именно специальный увлажняющий гель Fohow для лица и тела, чтобы обеспечить эффективное распространение и поглощение звуковой волны.
3. Рекомендованная длительность сеанса биоэнергетической регуляции кожи лица - от 15 до 30 минут. Превышение длительности сеанса или неправильное использование насадки может привести к переутомлению кожи или ухудшению поглощения питательных веществ.
4. Степень теплового воздействия рабочей поверхности насадки не зависит от уменьшения или увеличения выходной мощности ультразвука.
5. Воздействие насадки на сухую поверхность кожи может привести к ее пересушиванию или повреждению кожных покровов.
6. Зона воздействия ультразвуковой насадки не должна находиться близко к глазам, тем более не должна проходить через глазное яблоко.
7. Запрещается использовать насадку беременным и людям с серьезными заболеваниями сердца.
8. Не подвергайте прибор механическим воздействиям. В конце сеанса не забудьте очистить насадку и выключить источник питания.
9. Вектор выполнения движений при использовании насадки - снизу вверх, за исключением области носа.
10. Насадка не должна придавливать крылья носа во время сеанса.
11. Следует максимально легко и деликатно воздействовать насадкой в области точек Ди-Цан (уголок рта) и Тай-ян (внешние уголки глаз).
12. Тонкий роговой слой кожи и наличие купероза предполагает максимально деликатный непродолжительный сеанс с обильным увлажнением зон воздействия.

**133. Из каких материалов изготовлена ультразвуковая насадка?**
Насадка изготовлена из медицинского титанового сплава, который обладает отличной биосовместимостью и не вызывает раздражений.

**134. Сколько раз в неделю рекомендуется использовать насадку для оптимальной биоэнергетической регуляции зоны лица?**
Рекомендуемое спользование насадки для ухода за лицом не чаще 1-2 раза в неделю, но в зависимости от особенностей и типа кожи вы можете умеренно регулировать количество сеансов. Запрещается проведение нескольких повторных сеансов в течение одного дня, так как это может привести к переутомлению кожи, ухудшению впитываемости и даже нанесению серьезного ущерба кожным покровам.

**136. Можно ли использовать массажный гель Fohow в качестве жидкой проводящей среды при уходе за лицом с помощью ультразвуковой насадки?**
Нет, нельзя. Массажный гель Fohow разработан специально для проведения сеансов биоэнергетической регуляции с помощью перчаток, т.е. может быть использован для работы с другими зонами тела, исключая лицо. Для ухода за лицом с помощью насадки обязательно используйте специальный увлажняющий гель Fohow для лица и тела.

**137. Почему важно использовать именно увлажняющий гель Fohow для лица и тела в качестве жидкой среды при уходе за лицом?**
Увлажняющий гель Fohow - это универсальное косметическое средство по уходу за кожей тела и лица, которое обеспечивает проводящую среду во время сеансов биоэнергетического массажа. Гель разработан по уникальной рецептуре специалистами научно-исследовательского института Ян-Шэн Fohow из натуральных природных фитоэкстрактов. Он подходит для всех типов кожи, включая чувствительную. Уже после нескольких применений вы отметите улучшение состояния сухой или тусклой, а также обугревшей кожи. Регулярное использование геля сделает вашу кожу увлажненной, упругой и эластичной, свежей и сияющей. Средство эффективно для длительного увлажнения самых глубоких слоев кожи.

**138. Существует ли отличие ультразвуковой насадки для БЭМ 3.0 от ультразвука, используемого в медицинских учреждениях?**
В БЭМ 3.0 используется насадка с ультразвуковой волной для проведения косметических процедур. Ее проникающая сила воздействия абсолютно безопасна для организма. Аппаратура, которую применяют в работе по диагностике и для лечения различных видов заболеваний, медицинские работники, безусловно, обладает более широким диапазоном настроек и мощности. Поэтому работать с такими приборами может только квалифицированный специалист с медицинским образованием.

**139. Какие основные компоненты входят в состав увлажняющего геля Fohow для лица и тела?**
В состав входят ферментированная трамелла фукусовидная, экстракт дендробиума, бета-глюкан, овса, фолиевая кислота, гидролизованный коллаген, гиалуронат натрия и другие компоненты.

**140. Что делать при появлении зуда и покраснения кожи при проведении косметического сеанса с помощью насадки?**
Появление зуда и красной сыпи может быть следствием использования некачественной декоративной косметики и является реакцией на процесс детоксикации. Рекомендуется умыть лицо чистой водой и приложить холодный компресс. Приостановите сеансы по уходу за лицом на неделю. При проявлениях аллергических реакций прекратите использование.

**141. Что означает онемение губ после сеанса ультразвуковой биоэнергорегуляции лица?**
Во время сеанса подобная реакция может возникнуть вследствие значительной блокировки энергетических каналов вокруг губ. В случае сильного онемения рекомендуется сделать перерыв на 3-7 дней. Не злоупотребляйте слишком частыми и продолжительными сеансами регуляции, придерживайтесь рекомендаций специалистов Бизнес-Колледжа Fohow. Бесконтрольное использование насадки может вызвать переутомление и онемение кожи.

**142. Почему после сеанса ультразвуковой биоэнергорегуляции кожи лица у некоторых людей может возникать ощущение покалывания?**
Уход за лицом с помощью БЭМ 3.0 основан на принципах традиционной китайской медицины. Очистка энергетических каналов приводит к освобождению энергии Ци и свободной циркуляции крови, что обеспечивает питание и восстановление поврежденных участков кожи (происходит синтез коллагена и гиалуроновой кислоты). В процессе быстрого насыщения кожи компонентами увлажняющего геля Fohow для лица и тела может возникнуть небольшое ощущение покалывания - это нормальная реакция кожи. Особенно выражено такая реакция проявляется при наличии угревой сыпи или рубцов на лице - это свидетельствует о процессе восстановления тканей.

**143. На что обратить внимание при использовании ультразвуковой насадки для ухода за кожей лица?**
1. При наличии силиконовых и других внутренних протезов, стоматологических имплантов и подкожных инъекций филлеров, использование насадки не должно затрагивать зоны, где проводились данные виды вмешательств.
2. С особой осторожностью используйте насадку в случае перенесенных хирургических операций. Если они проводились, избегайте контакта этих участков кожи с насадкой (пластика век, носа, ушей и др.).
3. Цепочки, серьги и контактные линзы также необходимо снять перед началом сеанса.

**146. Почему появляется покалывание кожи лица после нанесения увлажняющего геля Fohow для лица и тела?**
Такая реакция кожи возможна при сильном обезвоживании. В процессе насыщения гиалуроновой кислотой, которая в большом количестве содержится в увлажняющем геле Fohow для лица и тела, может возникнуть ощущение покалывания. Это означает, что вам стоит уделять особенно тщательное внимание увлажнению вашей кожи.
